name: Build TouchController iOS Framework
on: [ pull_request, push, workflow_dispatch ]
jobs:
  build:
    name: Build iOS Dynamic Framework
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r28b
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          repository-cache: MODULE.bazel.lock
      - name: Setup Remote Cache
        uses: ./.github/actions/setup-bazel-cache
        with:
          host: ${{ vars.BAZEL_CACHE_HOST }}
          authorization: ${{ secrets.BAZEL_CACHE_AUTH }}
          downloader_cfg: ${{ vars.BAZEL_DOWNLOADER_CONFIG }}
          netrc: ${{ secrets.BAZEL_NETRC }}
          
      - name: Build
        run: |
          bazel build --verbose_failures --config=opt --ios_multi_cpus=arm64 //touchcontroller/proxy/server/ios:touchcontroller_proxy
          
      - name: Extract and format Dylib
        run: |
          unzip bazel-bin/touchcontroller/proxy/server/ios/touchcontroller_proxy.zip -d temp_out
          mv temp_out/touchcontroller_proxy.framework/touchcontroller_proxy libtouchcontroller_proxy.dylib
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: libtouchcontroller_proxy.dylib
          archive: false
          path: libtouchcontroller_proxy.dylib